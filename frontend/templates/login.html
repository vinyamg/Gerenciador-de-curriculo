{% extends "base.html" %}
{% block titulo %}Entrar — Caça Vaga{% endblock %}
{% block conteudo %}
<form id="form-login" novalidate data-js="login">
    <h2>Acessar Caça Vaga</h2>
    <div id="caixa-erro" class="caixa-erro" role="alert" hidden></div>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" maxlength="120" autocomplete="email" required>
    </div>
    <div class="form-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-enviar">Entrar</button>
    <p class="link-alternativo">Não tem conta?
        <a href="{{ url_for('pagina_cadastro') }}">Cadastre-se aqui</a></p>
</form>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
